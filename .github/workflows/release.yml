name: 'Publish Desktop Release'

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            arch_name: 'macOS Apple Silicon (M-series)'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            arch_name: 'macOS Intel'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            arch_name: 'Linux x64'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            arch_name: 'Windows x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Stagger ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}"
          releaseBody: 'See the assets below to download Stagger for your platform.'
          releaseDraft: true
          prerelease: false
          args: '--target ${{ matrix.target }}'

  finalize-release:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          if [ -z "$TAG" ]; then
            VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
            TAG="v$VERSION"
          fi

          echo "Target release tag: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Publishing draft release for tag: $TAG"
            gh release edit "$TAG" --draft=false --latest
            echo "Successfully published release $TAG!"
          else
            DRAFT_TAG=$(gh release list --limit 10 --json isDraft,tagName --jq '.[] | select(.isDraft) | .tagName' | head -n 1)
            if [ -n "$DRAFT_TAG" ]; then
              echo "Found draft release $DRAFT_TAG, publishing..."
              gh release edit "$DRAFT_TAG" --draft=false --latest
              echo "Successfully published release $DRAFT_TAG!"
            else
              echo "No draft release found to publish."
            fi
          fi
