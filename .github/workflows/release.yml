name: 'Publish Desktop Release'

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            arch_name: 'macOS Apple Silicon (M-series)'
            bundles: 'dmg,app'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            arch_name: 'macOS Intel'
            bundles: 'dmg,app'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            arch_name: 'Linux x64'
            bundles: 'deb,appimage'
          - platform: 'ubuntu-24.04-arm'
            target: 'aarch64-unknown-linux-gnu'
            arch_name: 'Linux ARM64'
            bundles: 'deb,appimage'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            arch_name: 'Windows x64'
            bundles: 'nsis'
          - platform: 'windows-latest'
            target: 'aarch64-pc-windows-msvc'
            arch_name: 'Windows ARM64'
            bundles: 'nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Enable MSVC Developer Command Prompt (ARM64 Cross-compilation)
        if: matrix.platform == 'windows-latest' && matrix.target == 'aarch64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Stagger ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}"
          releaseBody: |
            ### Assets
            Download the appropriate binary for your platform below.

            ### 🍎 Note for macOS
            If macOS displays *"Stagger is damaged and can't be opened"*, this is standard Gatekeeper quarantine for apps without an Apple Developer certificate. Run this in Terminal:
            ```bash
            xattr -cr /Applications/Stagger.app
            ```
            Or navigate to **System Settings > Privacy & Security** and click **Open Anyway**.
          releaseDraft: true
          prerelease: false
          uploadUpdaterSignatures: false
          args: '--target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ignore-version-mismatches'

  finalize-release:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          if [ -z "$TAG" ]; then
            VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
            TAG="v$VERSION"
          fi

          echo "Target release tag: $TAG"

          # Remove any stray .sig files if present from the release assets
          gh release view "$TAG" --json assets --jq '.assets[].name | select(endswith(".sig"))' 2>/dev/null | while read -r sig_asset; do
            if [ -n "$sig_asset" ]; then
              echo "Removing signature asset $sig_asset from release $TAG..."
              gh release delete-asset "$TAG" "$sig_asset" -y || true
            fi
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Publishing draft release for tag: $TAG"
            gh release edit "$TAG" --draft=false --latest
            echo "Successfully published release $TAG!"
          else
            DRAFT_TAG=$(gh release list --limit 10 --json isDraft,tagName --jq '.[] | select(.isDraft) | .tagName' | head -n 1)
            if [ -n "$DRAFT_TAG" ]; then
              echo "Found draft release $DRAFT_TAG, publishing..."
              gh release edit "$DRAFT_TAG" --draft=false --latest
              echo "Successfully published release $DRAFT_TAG!"
            else
              echo "No draft release found to publish."
            fi
          fi
